<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Chief of Staff{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='chief-of-staff-icon.svg') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='chief-of-staff-icon-32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='chief-of-staff-icon-16.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="{{ url_for('home') }}">
        <img
          class="product-icon"
          src="{{ url_for('static', filename='chief-of-staff-icon.svg') }}"
          width="32"
          height="32"
          alt=""
        >
        <span>Chief of Staff</span>
      </a>
      <span class="local-boundary">Private · Local only</span>
    </header>
    <main id="main-content" tabindex="-1">
      {% block content %}{% endblock %}
    </main>
    <footer>
      External sources remain authoritative. Local actions never modify them.
    </footer>
  </body>
</html>
