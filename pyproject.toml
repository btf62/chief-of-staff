[build-system]
requires = ["setuptools>=83,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "chief-of-staff"
version = "0.0.0"
description = "A local-first AI chief-of-staff system for one primary user."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brad Files" }]
dependencies = [
  "Flask==3.1.3",
  "openai==2.46.0",
  "waitress==3.0.2",
]

[dependency-groups]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "ruff==0.15.22",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chief_of_staff = ["py.typed", "persistence/migrations/*.sql"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
  "B",
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "RUF",
  "S",
  "SIM",
  "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
]
testpaths = ["tests"]
